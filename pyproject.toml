[project]
name = "korea-scholarship-mcp"
version = "0.6.2"
description = "MCP stdio server for KCI and OAK (Korean scholarship)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Christopher Gerteis", email = "christopher.gerteis@gmail.com" },
]
keywords = [
    "bibliographic-search",
    "digital-humanities",
    "east-asian-studies",
    "kci",
    "korea-citation-index",
    "korean-studies",
    "mcp",
    "model-context-protocol",
    "oai-pmh",
    "oak",
    "query-receipts",
    "scholarly-metadata",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "build>=1.2.0"]
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
korea-scholarship-mcp = "korea_scholarship_mcp:main"
korea-scholarship-mcp-ledger = "korea_scholarship_mcp.ledger:_cli"

[project.urls]
Homepage = "https://github.com/ckgerteis/korea-scholarship-mcp"
Repository = "https://github.com/ckgerteis/korea-scholarship-mcp"
Changelog = "https://github.com/ckgerteis/korea-scholarship-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/ckgerteis/korea-scholarship-mcp/issues"
Suite = "https://github.com/ckgerteis/bibliograph-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src layout: the wheel contains the package and nothing else.
#
# The earlier flat configuration — packages = ["."] with an `include` list —
# does not constrain the wheel: `include` filters within the selected root
# rather than replacing it, so the built wheel shipped tests/, pyproject.toml,
# README.md and .gitignore into the site-packages root, and installed `server`
# and `mediation` as top-level modules that collide with every sibling server
# built the same way.
[tool.hatch.build.targets.wheel]
packages = ["src/korea_scholarship_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
    "/CHANGELOG.md",
    "/install.ps1",
    "/install.py",
    "/mcpb",
    "/response-schema.json",
    "/.env.example",
]
